<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Plan your week, capture notes, and highlight urgent tasks." />
  <title>Weekly Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Your week, at a glance</p>
        <h1>Weekly planner</h1>
        <p class="subtitle">Make space for what matters.</p>
      </div>
      <button class="today-button" id="todayButton" type="button">Jump to today</button>
    </header>

    <section class="toolbar" aria-label="Planner controls">
      <div class="week-label"><span id="weekRange">This week</span><span class="saved-status" id="savedStatus">Saved locally</span></div>
      <div class="legend" aria-label="Priority legend">
        <span><i class="dot urgent"></i>Urgent</span>
        <span><i class="dot normal"></i>Normal</span>
        <span><i class="dot low"></i>Low</span>
      </div>
    </section>

    <section class="planner-grid" id="plannerGrid" aria-label="Weekly tasks"></section>

    <section class="notes-panel">
      <div class="notes-heading">
        <div><p class="eyebrow">Keep in mind</p><h2>Weekly notes</h2></div>
        <span class="notes-hint">Ideas, reminders, or a little encouragement</span>
      </div>
      <textarea id="notes" aria-label="Weekly notes" placeholder="What do you want to remember this week?"></textarea>
    </section>
  </main>

  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <div class="dialog-header"><div><p class="eyebrow">Plan a task</p><h2 id="dialogTitle">Add task</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></div>
      <label>Task<input id="taskTitle" name="title" required maxlength="80" placeholder="What needs doing?" /></label>
      <label>Priority<select id="taskPriority" name="priority"><option value="urgent">Urgent</option><option value="normal" selected>Normal</option><option value="low">Low</option></select></label>
      <input type="hidden" id="taskDay" />
      <input type="hidden" id="taskId" />
      <div class="dialog-actions"><button class="secondary-button" value="cancel">Cancel</button><button class="primary-button" value="default">Save task</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
